# ==========================================
# SALON JURGEN
# SVELTIA CMS
#
# VIJF LOSSE PAGINA'S
# REVIEWS MET STERREN EN DATUMS
# ==========================================


# ==========================================
# GITHUB
# ==========================================

backend:
  name: github
  repo: timdekruyf07-dotcom/Salon-jurgen-tester
  branch: main
  auth_methods:
    - token


# ==========================================
# TAAL
# ==========================================

locale: nl


# ==========================================
# AFBEELDINGEN
# ==========================================

media_folder: "images/uploads"
public_folder: "images/uploads"


# ==========================================
# BEHEERONDERDELEN
# ==========================================

collections:

  - name: paginas
    label: Website beheren

    files:


      # ====================================
      # HOMEPAGE
      # ====================================

      - name: homepage
        label: Home
        file: content/home.json
        format: json

        fields:

          - label: Bovenkant van de homepage
            name: hero
            widget: object
            collapsed: true

            fields:

              - label: Kleine tekst boven de titel
                name: eyebrow
                widget: string

              - label: Eerste regel van de titel
                name: title_line1
                widget: string

              - label: Tweede regel van de titel
                name: title_line2
                widget: string

              - label: Introductietekst
                name: description
                widget: text

              - label: Grote foto
                name: image
                widget: image
                required: false

              - label: Beschrijving van de foto
                name: image_alt
                widget: string
                required: false


      # ====================================
      # BEHANDELINGEN
      # ====================================

      - name: behandelingen
        label: Behandelingen
        file: content/behandelingen.json
        format: json

        fields:

          - label: Introductietekst
            name: introduction
            widget: text

          - label: Behandelingen
            name: services
            widget: list
            label_singular: Behandeling
            summary: "{{fields.name}}"
            required: false
            default: []

            fields:

              - label: Naam van de behandeling
                name: name
                widget: string

              - label: Beschrijving
                name: description
                widget: text

              - label: Prijs
                name: price
                widget: string
                required: false

              - label: Behandeltijd
                name: duration
                widget: string
                required: false

              - label: Zichtbaar op website
                name: published
                widget: boolean
                default: true


      # ====================================
      # OVER DE SALON EN REVIEWS
      # ====================================

      - name: overons
        label: Over de salon en reviews
        file: content/over-ons.json
        format: json

        fields:

          - label: Introductietekst bovenaan
            name: introduction
            widget: text

          - label: Titel over de salon
            name: title
            widget: string

          - label: Beschrijving van de salon
            name: description
            widget: text

          - label: Foto van de salon
            name: image
            widget: image
            required: false

          - label: Beschrijving van de foto
            name: image_alt
            widget: string
            required: false

          - label: Introductietekst bij reviews
            name: reviews_introduction
            widget: text


          # =================================
          # KLANTREVIEWS
          # =================================

          - label: Klantreviews
            name: reviews
            widget: list
            label_singular: Review
            summary: "{{fields.name}}"
            required: false
            default: []

            hint: "Voeg echte klantbeoordelingen toe. Je kunt de volgorde van reviews hier aanpassen."

            fields:

              # NAAM

              - label: Naam van de klant
                name: name
                widget: string


              # REVIEWTEKST

              - label: Beoordeling van de klant
                name: text
                widget: text


              # STERREN

              - label: Aantal sterren
                name: rating
                widget: number
                value_type: int
                min: 1
                max: 5
                step: 1
                required: false

                hint: "Vul de werkelijke beoordeling in: 1, 2, 3, 4 of 5 sterren. Laat leeg als het aantal onbekend is."


              # DATUM

              - label: Datum van de review
                name: date
                widget: string
                required: false
                pattern:
                  - '^$|^\d{4}-\d{2}-\d{2}$'
                  - "Gebruik JJJJ-MM-DD, bijvoorbeeld 2026-11-24. Laat leeg als de datum onbekend is."

                hint: "Bijvoorbeeld 2026-11-24. Gebruik de echte reviewdatum."


              # ZICHTBAARHEID

              - label: Zichtbaar op de website
                name: published
                widget: boolean
                default: true

                hint: "Zet uit om de review te bewaren zonder hem op de website te tonen."


      # ====================================
      # OPENINGSTIJDEN
      # ====================================

      - name: openingstijden
        label: Openingstijden
        file: content/openingstijden.json
        format: json

        fields:

          - label: Introductietekst
            name: introduction
            widget: text

          - label: Openingstijden
            name: opening_hours
            widget: list
            label_singular: Dag
            summary: "{{fields.day}}"
            required: false
            default: []

            fields:

              - label: Dag
                name: day
                widget: string

              - label: Openingstijden
                name: hours
                widget: string

          - label: Extra opmerking bij openingstijden
            name: note
            widget: text
            required: false

          - label: Praktische informatie
            name: extra_information
            widget: text
            required: false


      # ====================================
      # CONTACT
      # ====================================

      - name: contact
        label: Contact
        file: content/contact.json
        format: json

        fields:

          - label: Introductietekst
            name: introduction
            widget: text

          - label: Telefoonnummer
            name: phone
            widget: string
            required: false

          - label: E-mailadres
            name: email
            widget: string
            required: false

          - label: Straat en huisnummer
            name: address
            widget: string
            required: false

          - label: Postcode
            name: postal_code
            widget: string
            required: false

          - label: Plaats
            name: city
            widget: string
            required: false

          - label: Google Maps-link
            name: maps
            widget: string
            required: false

          - label: Online boekingslink
            name: booking_url
            widget: string
            required: false

          - label: Aanvullende informatie
            name: extra_information
            widget: text
            required: false
