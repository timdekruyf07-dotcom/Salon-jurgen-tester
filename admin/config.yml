# ==========================================
# SALON JURGEN
# SVELTIA CMS CONFIGURATIE
# VIJF LOSSE PAGINA'S
# ==========================================


# ==========================================
# GITHUB
# ==========================================

backend:
  name: github
  repo: timdekruyf07-dotcom/Salon-jurgen-tester
  branch: main
  auth_methods:
    - token


# ==========================================
# TAAL
# ==========================================

locale: nl


# ==========================================
# MEDIA
# ==========================================

media_folder: "images/uploads"
public_folder: "images/uploads"


# ==========================================
# BEHEERONDERDELEN
# ==========================================

collections:

  - name: paginas
    label: Website beheren

    files:


      # ====================================
      # HOMEPAGE
      # ====================================

      - name: homepage
        label: Home
        file: content/home.json
        format: json

        fields:

          - label: Bovenkant van de homepage
            name: hero
            widget: object
            collapsed: true

            fields:

              - label: Kleine tekst boven de titel
                name: eyebrow
                widget: string

              - label: Eerste regel van de titel
                name: title_line1
                widget: string

              - label: Tweede regel van de titel
                name: title_line2
                widget: string

              - label: Introductietekst
                name: description
                widget: text

              - label: Grote foto
                name: image
                widget: image
                required: false

              - label: Beschrijving van de foto
                name: image_alt
                widget: string
                required: false


      # ====================================
      # BEHANDELINGEN
      # ====================================

      - name: behandelingen
        label: Behandelingen
        file: content/behandelingen.json
        format: json

        fields:

          - label: Introductietekst
            name: introduction
            widget: text

          - label: Behandelingen
            name: services
            widget: list
            label_singular: Behandeling
            summary: "{{fields.name}}"
            required: false
            default: []

            hint: "Voeg behandelingen toe, verwijder ze of pas de prijzen aan."

            fields:

              - label: Naam van de behandeling
                name: name
                widget: string

              - label: Beschrijving
                name: description
                widget: text

              - label: Prijs
                name: price
                widget: string
                required: false
                hint: "Bijvoorbeeld: € 25,50"

              - label: Behandeltijd
                name: duration
                widget: string
                required: false
                hint: "Bijvoorbeeld: 30 minuten"

              - label: Zichtbaar op website
                name: published
                widget: boolean
                default: true


      # ====================================
      # OVER DE SALON EN REVIEWS
      # ====================================

      - name: overons
        label: Over de salon en reviews
        file: content/over-ons.json
        format: json

        fields:

          - label: Introductietekst bovenaan
            name: introduction
            widget: text

          - label: Titel over de salon
            name: title
            widget: string

          - label: Beschrijving van de salon
            name: description
            widget: text

          - label: Foto van de salon
            name: image
            widget: image
            required: false

          - label: Beschrijving van de foto
            name: image_alt
            widget: string
            required: false

          - label: Introductietekst bij reviews
            name: reviews_introduction
            widget: text

          - label: Klantreviews
            name: reviews
            widget: list
            label_singular: Review
            summary: "{{fields.name}}"
            required: false
            default: []

            hint: "Voeg hier echte klantbeoordelingen toe."

            fields:

              - label: Naam van de klant
                name: name
                widget: string

              - label: Beoordeling
                name: text
                widget: text

              - label: Zichtbaar op website
                name: published
                widget: boolean
                default: true


      # ====================================
      # OPENINGSTIJDEN
      # ====================================

      - name: openingstijden
        label: Openingstijden
        file: content/openingstijden.json
        format: json

        fields:

          - label: Introductietekst
            name: introduction
            widget: text

          - label: Openingstijden
            name: opening_hours
            widget: list
            label_singular: Dag
            summary: "{{fields.day}}"
            required: false
            default: []

            hint: "Voeg de openingstijden toe in de gewenste volgorde."

            fields:

              - label: Dag
                name: day
                widget: string

              - label: Openingstijden
                name: hours
                widget: string
                hint: "Bijvoorbeeld: 09:00 - 18:00 of Gesloten"

          - label: Extra opmerking bij openingstijden
            name: note
            widget: text
            required: false

          - label: Praktische informatie
            name: extra_information
            widget: text
            required: false


      # ====================================
      # CONTACT
      # ====================================

      - name: contact
        label: Contact
        file: content/contact.json
        format: json

        fields:

          - label: Introductietekst
            name: introduction
            widget: text

          - label: Telefoonnummer
            name: phone
            widget: string
            required: false

          - label: E-mailadres
            name: email
            widget: string
            required: false

          - label: Straat en huisnummer
            name: address
            widget: string
            required: false

          - label: Postcode
            name: postal_code
            widget: string
            required: false

          - label: Plaats
            name: city
            widget: string
            required: false

          - label: Google Maps-link
            name: maps
            widget: string
            required: false

          - label: Online boekingslink
            name: booking_url
            widget: string
            required: false

            hint: "Plak hier de officiële link naar het boekingssysteem."

          - label: Aanvullende informatie
            name: extra_information
            widget: text
            required: false
